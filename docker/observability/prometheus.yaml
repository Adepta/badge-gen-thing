global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape metrics exported by the OTel Collector's Prometheus exporter
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"

  # Direct scrape of the Kafka broker JMX metrics (if JMX exporter is added later)
  # - job_name: kafka
  #   static_configs:
  #     - targets: ["kafka:9101"]
