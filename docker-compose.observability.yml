name: docgen-observability

# =============================================================================
# Observability stack for DocumentGenerator
# =============================================================================
#
# Signal flow:
#
#   .NET apps (host)
#     └─ OTLP/gRPC :4317 ──► otel-collector
#                                ├─ logs    ──► loki      :3100
#                                ├─ traces  ──► tempo     :4317 (internal)
#                                └─ metrics ──► prometheus (scraped :8889)
#
#   grafana  ──► loki / tempo / prometheus
#   Open: http://localhost:3000  (admin / admin)
#
# Usage:
#   docker compose -f docker-compose.kafka.yml \
#                  -f docker-compose.observability.yml up -d
#
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  # Receives OTLP from .NET apps and fans out to Loki / Tempo / Prometheus.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: docgen-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  — your .NET apps point here
      - "4318:4318"   # OTLP HTTP  — alternative endpoint
      - "8889:8889"   # Prometheus scrape endpoint (metrics exported by collector)
      - "13133:13133" # Health-check endpoint
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Loki — log aggregation
  # Receives structured logs forwarded by the OTel Collector.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.4.2
    container_name: docgen-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Tempo — distributed tracing backend
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.7.2
    container_name: docgen-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./docker/observability/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana queries here)
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Prometheus — metrics store
  # Scrapes the OTel Collector's Prometheus exporter endpoint (:8889).
  # Also receives remote-write pushes from Tempo's metrics generator.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: docgen-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"   # needed for Tempo metrics generator
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Grafana — unified observability UI
  # Open: http://localhost:3000  (admin / admin)
  # Pre-provisioned data sources: Loki, Tempo, Prometheus (all linked together).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: docgen-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceQLStreaming metricsSummary"
      GF_INSTALL_PLUGINS: "grafana-lokiexplore-app"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
