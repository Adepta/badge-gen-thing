# =============================================================================
# DocumentGenerator — full stack
#
# Runs everything in one command:
#   Zookeeper + Kafka + Kafka UI
#   Api + Console + Bridge
#   OTel Collector + Loki + Tempo + Prometheus + Grafana
#
# Usage:
#   cp .env.example .env          # first time only — set API_KEY at minimum
#   docker compose -f docker-compose.full.yml up --build
#
# Ports exposed to your host:
#   8080  Api
#   5100  Bridge
#   8090  Kafka UI         (moved off 8080 to avoid conflict with Api)
#   9092  Kafka            (for external tools / local dotnet run)
#   3000  Grafana          (admin / admin)
#   9090  Prometheus
#   3100  Loki
#   3200  Tempo
#   4317  OTel Collector   (gRPC)
#   4318  OTel Collector   (HTTP)
# =============================================================================

name: docgen-full

services:

  # ===========================================================================
  # INFRASTRUCTURE — Zookeeper + Kafka
  # ===========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: docgen-zookeeper
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test:         ["CMD", "nc", "-z", "localhost", "2181"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: docgen-kafka
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                                1
      KAFKA_ZOOKEEPER_CONNECT:                        zookeeper:2181
      KAFKA_LISTENERS:                                PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:                     PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:           PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:               PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:         1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:            1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                "true"
      KAFKA_LOG_RETENTION_HOURS:                      24
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:         0
      KAFKA_HEAP_OPTS:                                "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:         ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval:     15s
      timeout:      10s
      retries:      10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 384m

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: docgen-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'Creating topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic render.requests   --partitions 4 --replication-factor 1 --config retention.ms=86400000
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic render.results    --partitions 4 --replication-factor 1 --config retention.ms=3600000
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic render.deadletter --partitions 1 --replication-factor 1 --config retention.ms=604800000
        echo 'Topics ready:'
        kafka-topics --bootstrap-server kafka:29092 --list
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: docgen-kafka-ui
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME:             local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER:        zookeeper:2181
      DYNAMIC_CONFIG_ENABLED:            "true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m

  # ===========================================================================
  # OBSERVABILITY — OTel Collector + Loki + Tempo + Prometheus + Grafana
  # ===========================================================================

  loki:
    image: grafana/loki:3.4.2
    container_name: docgen-loki
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test:         ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m

  tempo:
    image: grafana/tempo:2.7.2
    container_name: docgen-tempo
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./docker/observability/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test:         ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: docgen-prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test:         ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: docgen-otel-collector
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      loki:  { condition: service_healthy }
      tempo: { condition: service_healthy }
    healthcheck:
      test:         ["CMD", "/otelcol-contrib", "--help"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  grafana:
    image: grafana/grafana:11.5.2
    container_name: docgen-grafana
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_FEATURE_TOGGLES_ENABLE:  "traceqlEditor traceQLStreaming metricsSummary"
      GF_INSTALL_PLUGINS:         "grafana-lokiexplore-app"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  # ===========================================================================
  # APPLICATION — Api + Console + Bridge
  # ===========================================================================

  api:
    build:
      context:    .
      dockerfile: src/DocumentGenerator.Api/Dockerfile
    image: documentgenerator/api:latest
    container_name: docgen-api
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT:           Production
      ASPNETCORE_URLS:                  http://+:8080
      Urls:                             http://+:8080
      ApiAuth__ApiKey:                  "${API_KEY:-dev-api-key-insecure}"
      Cors__AllowedOrigins:             "${CORS_ALLOWED_ORIGINS:-*}"
      Kafka__Enabled:                   "true"
      Kafka__BootstrapServers:          kafka:29092
      Kafka__SecurityProtocol:          "${KAFKA_SECURITY_PROTOCOL:-Plaintext}"
      Kafka__SaslMechanism:             "${KAFKA_SASL_MECHANISM:-}"
      Kafka__SaslUsername:              "${KAFKA_SASL_USERNAME:-}"
      Kafka__SaslPassword:              "${KAFKA_SASL_PASSWORD:-}"
      RateLimit__RenderPermitLimit:     "${RATE_LIMIT_RENDER:-10}"
      RateLimit__WindowSeconds:         "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      OpenTelemetry__Enabled:           "true"
      OpenTelemetry__ServiceName:       "DocumentGenerator.Api"
      OpenTelemetry__OtlpEndpoint:      http://otel-collector:4317
    healthcheck:
      test:         ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval:     15s
      timeout:      5s
      retries:      10
      start_period: 60s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

  console:
    build:
      context:    .
      dockerfile: src/DocumentGenerator.Console/Dockerfile
    image: documentgenerator/console:latest
    container_name: docgen-console
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - render-output:/app/output
      - render-logs:/app/logs
    environment:
      DOTNET_ENVIRONMENT:               Production
      Kafka__Enabled:                   "true"
      Kafka__BootstrapServers:          kafka:29092
      Kafka__SecurityProtocol:          "${KAFKA_SECURITY_PROTOCOL:-Plaintext}"
      Kafka__SaslMechanism:             "${KAFKA_SASL_MECHANISM:-}"
      Kafka__SaslUsername:              "${KAFKA_SASL_USERNAME:-}"
      Kafka__SaslPassword:              "${KAFKA_SASL_PASSWORD:-}"
      BrowserPool__MaxSize:             "${BROWSER_POOL_MAX_SIZE:-4}"
      Kafka__MaxConcurrentRenders:      "${KAFKA_MAX_CONCURRENT_RENDERS:-4}"
      OpenTelemetry__Enabled:           "true"
      OpenTelemetry__ServiceName:       "DocumentGenerator.Console"
      OpenTelemetry__OtlpEndpoint:      http://otel-collector:4317
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  bridge:
    build:
      context:    .
      dockerfile: src/DocumentGenerator.Bridge/Dockerfile
    image: documentgenerator/bridge:latest
    container_name: docgen-bridge
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT:           Production
      ASPNETCORE_URLS:                  http://+:5100
      Cloud__BaseUrl:                   http://api:8080
      Cloud__ApiKey:                    "${API_KEY:-dev-api-key-insecure}"
      Bridge__IsConfigured:             "true"
      OpenTelemetry__Enabled:           "true"
      OpenTelemetry__ServiceName:       "DocumentGenerator.Bridge"
      OpenTelemetry__OtlpEndpoint:      http://otel-collector:4317
    healthcheck:
      test:         ["CMD", "wget", "--spider", "-q", "http://localhost:5100/health"]
      interval:     30s
      timeout:      5s
      retries:      3
      start_period: 10s
    depends_on:
      api:
        condition: service_started
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

# =============================================================================
# Volumes
# =============================================================================

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  render-output:
  render-logs:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
