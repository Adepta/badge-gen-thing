  assemblies:
  - DocumentGenerator.Api
  namespace: DocumentGenerator.Api.Services
  summary: Builds a <xref href="DocumentGenerator.Core.Models.DocumentTemplate" data-throw-if-not-resolved="false"></xref> for the given template name and variable bag.
  example: []
  syntax:
    content: public DocumentTemplate Resolve(string templateName, Dictionary<string, object?> variables, Branding? branding = null)
    parameters:
    - id: templateName
      type: System.String
      description: >-
        Short name of the template, e.g. <code>"badge-pulse-a6"</code>.

        Must correspond to <code>{templateName}.html</code> in the templates directory.
    - id: variables
      type: System.Collections.Generic.Dictionary{System.String,System.Object}
      description: Attendee / badge data injected as Handlebars variables.
    - id: branding
      type: DocumentGenerator.Core.Models.Branding
      description: Optional branding overrides. When null, sensible defaults are used.
    return:
      type: DocumentGenerator.Core.Models.DocumentTemplate
      description: A <xref href="DocumentGenerator.Core.Models.DocumentTemplate" data-throw-if-not-resolved="false"></xref> ready to pass to <code>IDocumentPipeline</code>.
    content.vb: Public Function Resolve(templateName As String, variables As Dictionary(Of String, Object), branding As Branding = Nothing) As DocumentTemplate
