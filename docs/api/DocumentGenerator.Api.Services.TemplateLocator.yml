  assemblies:
  - DocumentGenerator.Api
  namespace: DocumentGenerator.Api.Services
  summary: >-
    Resolves a named badge template (e.g. <code>"badge-pulse-a6"</code>) to a fully populated

    <xref href="DocumentGenerator.Core.Models.DocumentTemplate" data-throw-if-not-resolved="false"></xref> by reading the corresponding HTML and CSS files from

    the configured templates directory.
  remarks: >-
    Templates are stored as pairs of files:


    <ul><li><code>{name}.html</code> — Handlebars HTML template</li><li><code>{name}.css</code> — companion stylesheet (optional)</li></ul>


    The <xref href="DocumentGenerator.Core.Models.DocumentTemplate" data-throw-if-not-resolved="false"></xref> returned uses <xref href="DocumentGenerator.Core.Models.TemplateContent.HtmlPath" data-throw-if-not-resolved="false"></xref>

    and <xref href="DocumentGenerator.Core.Models.TemplateContent.CssPath" data-throw-if-not-resolved="false"></xref> so the existing

    <code>FileTemplateContentResolver</code> resolves the files at render time.
