  assemblies:
  - DocumentGenerator.Bridge
  namespace: DocumentGenerator.Bridge.Printing
  summary: >-
    Abstraction over a local printer. Implementations handle OS-specific

    print spooler APIs so the rest of the bridge remains platform-agnostic.
  remarks: >-
    Two adapters are provided out of the box:


    <ul><li><xref href="DocumentGenerator.Bridge.Printing.WindowsPrinterAdapter" data-throw-if-not-resolved="false"></xref> — uses <code>System.Drawing.Printing</code> on Windows.</li><li><xref href="DocumentGenerator.Bridge.Printing.CupsPrinterAdapter" data-throw-if-not-resolved="false"></xref> — shells out to <code>lp</code> on Linux and macOS.</li></ul>


    The correct adapter is selected at startup via <xref href="DocumentGenerator.Bridge.Printing.PrinterAdapterFactory" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public interface IPrinterAdapter
    content.vb: Public Interface IPrinterAdapter
  derivedClasses:
  - DocumentGenerator.Bridge.Printing.CupsPrinterAdapter
  - DocumentGenerator.Bridge.Printing.WindowsPrinterAdapter
