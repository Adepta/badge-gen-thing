  namespace: DocumentGenerator.Bridge.Printing
  summary: >-
    <xref href="DocumentGenerator.Bridge.Printing.IPrinterAdapter" data-throw-if-not-resolved="false"></xref> implementation for Linux and macOS.

    Uses the CUPS <code>lp</code> command-line utility to submit print jobs,

    which natively handles both PDF and PNG documents.
  remarks: >-
    <code>lp</code> is available by default on macOS and on most Linux distributions

    that have CUPS installed (e.g. <code>apt install cups</code> on Debian/Ubuntu).
