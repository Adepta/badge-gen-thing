  assemblies:
  - DocumentGenerator.Bridge
  namespace: DocumentGenerator.Bridge.Printing
  summary: Sends raw document bytes to the specified printer via the OS print spooler.
  example: []
  syntax:
    content: public Task<PrintResult> PrintAsync(byte[] documentBytes, string mimeType, string? printerName, string jobName, CancellationToken cancellationToken = default)
    parameters:
    - id: documentBytes
      type: System.Byte[]
      description: PDF or PNG bytes to print.
    - id: mimeType
      type: System.String
      description: 'MIME type of the document: <code>application/pdf</code> or <code>image/png</code>.'
    - id: printerName
      type: System.String
      description: Target printer name. When <code>null</code> or empty, the OS default printer is used.
    - id: jobName
      type: System.String
      description: Display name shown in the print queue, e.g. <code>"Badge – Jane Smith"</code>.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the print operation.
    return:
      type: System.Threading.Tasks.Task{DocumentGenerator.Bridge.Printing.PrintResult}
      description: A <xref href="DocumentGenerator.Bridge.Printing.PrintResult" data-throw-if-not-resolved="false"></xref> describing whether the job was submitted successfully.
    content.vb: Public Function PrintAsync(documentBytes As Byte(), mimeType As String, printerName As String, jobName As String, cancellationToken As CancellationToken = Nothing) As Task(Of PrintResult)
