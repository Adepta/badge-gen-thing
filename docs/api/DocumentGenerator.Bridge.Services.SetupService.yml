  assemblies:
  - DocumentGenerator.Bridge
  namespace: DocumentGenerator.Bridge.Services
  summary: >-
    Saves the completed setup configuration to <code>appsettings.json</code> and

    marks the bridge as configured so normal operation resumes on next start.
  example: []
  syntax:
    content: public Task SaveConfigurationAsync(string cloudBaseUrl, string apiKey, string? defaultPrinterName, string format, int port)
    parameters:
    - id: cloudBaseUrl
      type: System.String
      description: Base URL of the cloud Badge Producer API.
    - id: apiKey
      type: System.String
      description: API key for authenticating with the cloud API.
    - id: defaultPrinterName
      type: System.String
      description: Local printer name; <code>null</code> means OS default.
    - id: format
      type: System.String
      description: 'Document format: <code>"Pdf"</code> or <code>"Png"</code>.'
    - id: port
      type: System.Int32
      description: Port the bridge HTTP server should listen on.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function SaveConfigurationAsync(cloudBaseUrl As String, apiKey As String, defaultPrinterName As String, format As String, port As Integer) As Task
