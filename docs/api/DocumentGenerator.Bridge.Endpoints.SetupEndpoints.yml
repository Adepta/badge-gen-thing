  namespace: DocumentGenerator.Bridge.Endpoints
  summary: Maps the first-run setup wizard endpoints.
  remarks: >-
    When the bridge is unconfigured (<code>Bridge:IsConfigured = false</code>),

    all non-health requests are redirected to <code>/setup</code> by the

    <xref href="DocumentGenerator.Bridge.Middleware.SetupGuardMiddleware" data-throw-if-not-resolved="false"></xref>.


    The setup wizard is a single-page HTML form served from <code>/setup</code>.

    On submission it posts to <code>/setup/save</code> which writes <code>appsettings.json</code>.
