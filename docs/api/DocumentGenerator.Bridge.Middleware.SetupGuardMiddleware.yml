  assemblies:
  - DocumentGenerator.Bridge
  namespace: DocumentGenerator.Bridge.Middleware
  summary: >-
    Intercepts requests and redirects to <code>/setup</code> when the bridge is unconfigured.

    Setup-related paths (<code>/setup</code>, <code>/health</code>) are always allowed through.
  example: []
  syntax:
